[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zubair-jarvis-agents"
version = "0.1.0"
description = "Local-first, provider-neutral runtime for the JARVIS AI agent collection."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Zubair Digital Kits" }]
dependencies = []

[project.scripts]
jarvis-agents = "jarvis_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
