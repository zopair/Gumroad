name: Build and validate product workbooks
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_product_workbooks.py"
      - "tests/test_build_product_workbooks.py"
      - ".github/workflows/build-product-workbooks.yml"
concurrency:
  group: gumroad-product-workbooks
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook dependency
        run: python -m pip install --upgrade pip openpyxl
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_build_product_workbooks.py" -v
      - name: Build ten workbooks
        run: |
          set -euo pipefail
          python scripts/build_product_workbooks.py . dist
          cp dist/business-launch-planner.xlsx products/01-business-launch-planner/
          cp dist/30-day-content-calendar.xlsx products/02-content-calendar/
          cp dist/100-content-hooks.xlsx products/03-content-hooks/
          cp dist/caption-writing-workbench.xlsx products/04-caption-workbench/
          cp dist/welcome-email-sequence.xlsx products/05-welcome-email-kit/
          cp dist/sales-follow-up-pack.xlsx products/06-sales-follow-up-pack/
          cp dist/simple-crm-lead-tracker.xlsx products/07-simple-crm-lead-tracker/
          cp dist/client-onboarding-pack.xlsx products/08-client-onboarding-pack/
          cp dist/proposal-sow-template.xlsx products/09-proposal-sow-template/
          cp dist/service-pricing-calculator.xlsx products/10-service-pricing-workbook/
          test "$(find products -maxdepth 2 -name '*.xlsx' | wc -l)" -eq 10
      - name: Commit validated workbooks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find products -maxdepth 2 -name '*.xlsx' -print0 | xargs -0 -r git add
          git commit -m "Add ten validated editable product workbooks"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
