name: JARVIS AI Agents — quality gates
on:
  pull_request:
    paths:
      - "ai-agents/runtime/**"
      - ".github/workflows/jarvis-agents.yml"
  push:
    branches:
      - "feat/jarvis-ai-agents-foundation"
    paths:
      - "ai-agents/runtime/**"
      - ".github/workflows/jarvis-agents.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    name: Python ${{ matrix.python-version }} contract and safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: ai-agents/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Run contract and safety tests
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q src

  package-previews:
    name: Build isolated product ZIP previews
    needs: runtime-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-agents/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ten isolated product archives
        run: python tools/build_bundles.py --output-dir dist
      - name: Upload preview archives and checksums
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-product-previews
          path: ai-agents/runtime/dist/
          if-no-files-found: error
          retention-days: 7
