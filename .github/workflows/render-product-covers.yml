name: Render product gallery assets
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/render-product-covers.yml"
      - "products/**/assets/*.svg"
concurrency:
  group: gumroad-product-assets
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render product covers, previews and mockups
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            out="${file%.svg}.png"
            rsvg-convert --format=png --width=1600 --height=1000 "$file" > "$out"
            file "$out"
            count=$((count + 1))
          done < <(find products -type f -path '*/assets/*.svg' -print0)
          test "$count" -eq 40
      - name: Commit rendered PNG assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find products -type f -path '*/assets/*.png' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo "No rendered product assets changed."
            exit 0
          fi
          git commit -m "Render product gallery preview and mockup assets"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
