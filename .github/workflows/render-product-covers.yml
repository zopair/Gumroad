name: Render product cover assets
on:
  workflow_dispatch:
  push:
    paths:
      - "products/**/assets/cover.svg"
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render PNG covers
        run: |
          find products -path '*/assets/cover.svg' -print0 | while IFS= read -r -d '' file; do
            rsvg-convert --format=png --width=1600 --height=1000 "$file" > "${file%.svg}.png"
          done
      - name: Commit rendered covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/**/assets/*.png
          if git diff --cached --quiet; then
            echo "No rendered covers changed."
          else
            git commit -m "Render product cover previews"
            git push
          fi
