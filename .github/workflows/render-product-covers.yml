name: Render product gallery, brand and marketing assets
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/render-product-covers.yml"
      - "products/**/assets/*.svg"
      - "storefront/*.svg"
      - "marketing/**/*.svg"
concurrency:
  group: gumroad-product-assets
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin ffmpeg
      - name: Render product covers, previews, mockups, brand and campaign assets
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            out="${file%.svg}.png"
            if [[ "$file" == "storefront/brand-avatar.svg" ]]; then
              rsvg-convert --format=png --width=1024 --height=1024 "$file" > "$out"
            elif [[ "$file" == "storefront/favicon.svg" ]]; then
              rsvg-convert --format=png --width=128 --height=128 "$file" > "$out"
            elif [[ "$file" == "storefront/brand-wordmark.svg" ]]; then
              rsvg-convert --format=png --width=1600 --height=400 "$file" > "$out"
            elif [[ "$file" == marketing/* ]]; then
              rsvg-convert --format=png --width=1000 --height=1500 "$file" > "$out"
            else
              rsvg-convert --format=png --width=1600 --height=1000 "$file" > "$out"
            fi
            file "$out"
            count=$((count + 1))
          done < <(find products storefront marketing -type f -name '*.svg' -print0)
          test "$count" -eq 53
      - name: Create subtle animated product mockup GIFs
        run: |
          set -euo pipefail
          count=0
          for png in products/*/assets/mockup-03.png; do
            gif="${png%.png}.gif"
            ffmpeg -hide_banner -loglevel error -y -loop 1 -i "$png" \
              -vf "scale=800:500,zoompan=z='1+0.025*(1+sin(2*PI*on/60))':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=60:s=800x500:fps=12,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse" \
              -frames:v 60 -loop 0 "$gif"
            test -s "$gif"
            count=$((count + 1))
          done
          test "$count" -eq 10
      - name: Commit rendered assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find products storefront marketing -type f \( -name '*.png' -o -name '*.gif' \) -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo "No rendered assets changed."
            exit 0
          fi
          git commit -m "Render store gallery, animated mockups and campaign assets"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
