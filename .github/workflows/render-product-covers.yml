name: Render product gallery, brand and marketing assets
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/render-product-covers.yml"
      - "products/**/assets/*.svg"
      - "storefront/*.svg"
      - "marketing/**/*.svg"
concurrency:
  group: gumroad-product-assets
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render product covers, previews, mockups, brand and campaign assets
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            out="${file%.svg}.png"
            if [[ "$file" == "storefront/brand-avatar.svg" ]]; then
              rsvg-convert --format=png --dpi-x=96 --dpi-y=96 --width=1024 --height=1024 "$file" > "$out"
            elif [[ "$file" == "storefront/favicon.svg" ]]; then
              rsvg-convert --format=png --width=128 --height=128 "$file" > "$out"
            elif [[ "$file" == "storefront/brand-wordmark.svg" ]]; then
              rsvg-convert --format=png --width=1600 --height=400 "$file" > "$out"
            elif [[ "$file" == marketing/* ]]; then
              rsvg-convert --format=png --width=1000 --height=1500 "$file" > "$out"
            else
              rsvg-convert --format=png --width=1600 --height=1000 "$file" > "$out"
            fi
            file "$out"
            count=$((count + 1))
          done < <(find products storefront marketing -type f -name '*.svg' ! -name 'thumbnail.svg' -print0)
          test "$count" -eq 53
      - name: Commit rendered assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find products storefront marketing -type f -name '*.png' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo "No rendered assets changed."
            exit 0
          fi
          git commit -m "Render store gallery and campaign assets"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
